<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #10264b, #050816 65%);
  color: #eaf6ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 520px;
  padding: 28px 20px;
  text-align: center;
}
h1 {
  color: #55d8ff;
  letter-spacing: 8px;
  margin-top: 35px;
}
.sub { color: #8caecb; }
.orb {
  width: 180px;
  height: 180px;
  margin: 35px auto 20px;
  border: 2px solid #38cfff;
  border-radius: 50%;
  box-shadow: 0 0 35px #0879b8, inset 0 0 30px #0879b8;
  display: grid;
  place-items: center;
  font-size: 65px;
}
.orb.active { animation: pulse 1.2s infinite alternate; }
@keyframes pulse {
  from { box-shadow: 0 0 20px #0879b8; }
  to { box-shadow: 0 0 55px #38cfff; }
}
button {
  border: 0;
  border-radius: 30px;
  padding: 14px 22px;
  margin: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
#mic { background: #37ceff; color: #04101d; }
#stop { background: #24364d; color: white; }
.panel {
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #1b4567;
  border-radius: 15px;
  text-align: left;
  overflow-wrap: anywhere;
  min-height: 75px;
  background: #091528;
}
.label { color: #55d8ff; font-size: 12px; }
#status { color: #8caecb; margin: 15px; }
</style>
</head>

<body>
<main class="app">
  <h1>JARVIS</h1>
  <p class="sub">PERSONAL AI VOICE ASSISTANT</p>

  <div class="orb" id="orb">🎙️</div>
  <p id="status">Ready for your command</p>

  <button id="mic">🎙️ START LISTENING</button>
  <button id="stop">🔇 STOP</button>

  <div class="panel">
    <div class="label">YOU SAID</div>
    <p id="heard">Waiting for voice...</p>
  </div>

  <div class="panel">
    <div class="label">JARVIS REPLY</div>
    <p id="reply">Hello! I am ready.</p>
  </div>
</main>

<script>
const API = "https://jarvis-web-api.onrender.com/chat";

const statusEl = document.getElementById("status");
const heardEl = document.getElementById("heard");
const replyEl = document.getElementById("reply");
const orb = document.getElementById("orb");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let listening = false;

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-IN";
  utterance.rate = 1;
  speechSynthesis.speak(utterance);
}

async function askJarvis(message) {
  statusEl.textContent = "JARVIS is thinking...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    const answer = data.reply || "I received an empty reply.";
    replyEl.textContent = answer;
    statusEl.textContent = "Reply received";
    speak(answer);
  } catch (error) {
    statusEl.textContent = "Connection error. Please try again.";
    replyEl.textContent = error.message;
  }
}

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    orb.classList.add("active");
    statusEl.textContent = "Listening... Speak now";
  };

  recognition.onresult = event => {
    const message = event.results[0][0].transcript;
    heardEl.textContent = message;
    askJarvis(message);
  };

  recognition.onerror = event => {
    statusEl.textContent = "Mic error: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    orb.classList.remove("active");
  };
} else {
  statusEl.textContent =
    "Voice recognition is unsupported in this browser.";
}

document.getElementById("mic").onclick = () => {
  if (!recognition) {
    alert("Please open this page in a supported Chrome browser.");
    return;
  }

  if (!listening) {
    try {
      recognition.start();
    } catch (error) {
      statusEl.textContent = "Please try again.";
    }
  }
};

document.getElementById("stop").onclick = () => {
  if (recognition && listening) recognition.stop();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  statusEl.textContent = "Stopped";
  orb.classList.remove("active");
};
</script>
</body>
</html>
