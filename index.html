
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #10264b, #050816 65%);
  color: #eaf6ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 520px;
  padding: 28px 20px;
  text-align: center;
}

h1 {
  color: #55d8ff;
  letter-spacing: 8px;
  margin-top: 35px;
  font-size: 42px;
}

.sub {
  color: #8caecb;
}

.orb {
  width: 180px;
  height: 180px;
  margin: 35px auto 20px;
  border: 2px solid #38cfff;
  border-radius: 50%;
  box-shadow: 0 0 35px #0879b8,
              inset 0 0 30px #0879b8;
  display: grid;
  place-items: center;
  font-size: 65px;
}

.orb.active {
  animation: pulse 1.2s infinite alternate;
}

@keyframes pulse {
  from {
    box-shadow: 0 0 20px #0879b8;
  }
  to {
    box-shadow: 0 0 55px #38cfff;
  }
}

button {
  border: 0;
  border-radius: 30px;
  padding: 15px 22px;
  margin: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#mic {
  background: #37ceff;
  color: #04101d;
}

#stop {
  background: #24364d;
  color: white;
}

#status {
  color: #8caecb;
  margin: 18px 0;
  min-height: 24px;
  overflow-wrap: anywhere;
}

.panel {
  display: none;
}
</style>
</head>

<body>
<main class="app">

  <h1>JARVIS</h1>
  <p class="sub">PERSONAL AI VOICE ASSISTANT</p>

  <div class="orb" id="orb">🎙️</div>

  <p id="status">Ready for your command</p>

  <button id="mic">🎙️ START LISTENING</button>
  <button id="stop">🔇 STOP</button>

  <div class="panel">
    <div>YOU SAID</div>
    <p id="heard">Waiting for voice...</p>
  </div>

  <div class="panel">
    <div>JARVIS REPLY</div>
    <p id="reply"></p>
  </div>

</main>

<script>
const API = "https://jarvis-web-api.onrender.com/chat";

const statusEl = document.getElementById("status");
const heardEl = document.getElementById("heard");
const replyEl = document.getElementById("reply");
const orb = document.getElementById("orb");
const micButton = document.getElementById("mic");
const stopButton = document.getElementById("stop");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let keepListening = false;
let busy = false;
let requestId = 0;
let restartTimer = null;

function cleanText(text) {
  return String(text || "")
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/__(.*?)__/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/#{1,6}\s*/g, "")
    .replace(/^\s*[-*]\s+/gm, "")
    .replace(/^\s*\d+[.)]\s+/gm, "")
    .replace(/[*_#`]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function startRecognition() {
  if (!keepListening || busy || !recognition) {
    return;
  }

  try {
    recognition.start();
  } catch (error) {
    console.warn("Recognition start:", error.message);
  }
}

function scheduleRecognition(delay = 700) {
  clearTimeout(restartTimer);

  if (keepListening && !busy) {
    restartTimer = setTimeout(startRecognition, delay);
  }
}

function speak(text, currentRequest) {
  if (currentRequest !== requestId) return;

  const message = cleanText(text);

  if (!message) {
    busy = false;
    statusEl.textContent = "JARVIS received an empty reply.";
    scheduleRecognition();
    return;
  }

  if (!("speechSynthesis" in window)) {
    busy = false;
    statusEl.textContent = "Text-to-speech is unsupported.";
    scheduleRecognition();
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);

  utterance.lang = /[\u0900-\u097F]/.test(message)
    ? "hi-IN"
    : "en-IN";

  utterance.rate = 1.05;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = () => {
    if (currentRequest === requestId) {
      statusEl.textContent = "JARVIS is speaking...";
    }
  };

  utterance.onend = () => {
    if (currentRequest !== requestId) return;

    busy = false;

    if (keepListening) {
      statusEl.textContent = "Listening for your next command...";
      scheduleRecognition(700);
    } else {
      statusEl.textContent = "Ready";
    }
  };

  utterance.onerror = event => {
    if (currentRequest !== requestId) return;

    console.error("Speech error:", event.error);
    busy = false;
    statusEl.textContent = "Voice playback failed.";

    scheduleRecognition(900);
  };

  window.speechSynthesis.speak(utterance);
}

async function askJarvis(message) {
  if (!message || busy) return;

  busy = true;
  const currentRequest = ++requestId;

  statusEl.textContent = "JARVIS is thinking...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message:
          "You are JARVIS, a friendly personal voice assistant. " +
          "Answer in at most 2 short sentences and under 25 words. " +
          "Be direct and natural. No markdown, headings, lists, " +
          "or unnecessary explanations. Reply in the language " +
          "the user speaks. User says: " + message
      })
    });

    const responseText = await response.text();

    let data;

    try {
      data = JSON.parse(responseText);
    } catch {
      throw new Error(
        "Server returned an invalid response (HTTP " +
        response.status + ")."
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Server returned HTTP " + response.status
      );
    }

    if (currentRequest !== requestId) return;

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("The AI returned an empty reply.");
    }

    const answer = cleanText(data.reply);

    // Keep the existing voice-only interface.
    replyEl.textContent = answer;
    speak(answer, currentRequest);

  } catch (error) {
    if (currentRequest !== requestId) return;

    console.error("JARVIS request failed:", error);

    busy = false;

    const details = error.message || "Unknown error";

    if (error instanceof TypeError) {
      statusEl.textContent =
        "Network/CORS error. Check browser console and Render logs.";
    } else {
      statusEl.textContent = "JARVIS error: " + details;
    }

    // Speak a short error message without hiding the status.
    const utterance = new SpeechSynthesisUtterance(
      "Sorry, I could not get an answer. Please check the connection."
    );

    utterance.lang = "en-IN";

    utterance.onend = () => {
      if (currentRequest !== requestId) return;

      if (keepListening) {
        scheduleRecognition(700);
      }
    };

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    } else {
      scheduleRecognition();
    }
  }
}

if (SpeechRecognition) {
  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    orb.classList.add("active");
    statusEl.textContent = "Listening... Speak now";
  };

  recognition.onresult = event => {
    const message =
      event.results[0][0].transcript.trim();

    if (!message || busy) return;

    heardEl.textContent = message;
    askJarvis(message);
  };

  recognition.onerror = event => {
    orb.classList.remove("active");
    console.error("Recognition error:", event.error);

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      keepListening = false;
      statusEl.textContent = "Please allow microphone access.";
    } else if (event.error === "no-speech") {
      statusEl.textContent = "Didn't hear anything. Try again...";
    } else if (event.error === "network") {
      statusEl.textContent =
        "Voice recognition network error. Check internet.";
    } else if (event.error !== "aborted") {
      statusEl.textContent =
        "Voice recognition error: " + event.error;
    }
  };

  recognition.onend = () => {
    orb.classList.remove("active");

    if (keepListening && !busy) {
      scheduleRecognition(700);
    }
  };

} else {
  statusEl.textContent =
    "Voice recognition is unsupported. Try Chrome.";
}

micButton.onclick = () => {
  if (!recognition) {
    alert("Please use a supported Chrome browser.");
    return;
  }

  keepListening = true;
  startRecognition();
};

stopButton.onclick = () => {
  keepListening = false;
  busy = false;
  requestId++;

  clearTimeout(restartTimer);

  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  orb.classList.remove("active");
  statusEl.textContent = "Stopped";
};
</script>
</body>
</html>
