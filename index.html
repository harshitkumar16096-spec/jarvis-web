<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #10264b, #050816 65%);
  color: #eaf6ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 520px;
  padding: 28px 20px;
  text-align: center;
}
h1 {
  color: #55d8ff;
  letter-spacing: 8px;
  margin-top: 35px;
}
.sub { color: #8caecb; }
.orb {
  width: 180px;
  height: 180px;
  margin: 35px auto 20px;
  border: 2px solid #38cfff;
  border-radius: 50%;
  box-shadow: 0 0 35px #0879b8, inset 0 0 30px #0879b8;
  display: grid;
  place-items: center;
  font-size: 65px;
}
.orb.active { animation: pulse 1.2s infinite alternate; }
@keyframes pulse {
  from { box-shadow: 0 0 20px #0879b8; }
  to { box-shadow: 0 0 55px #38cfff; }
}
button {
  border: 0;
  border-radius: 30px;
  padding: 14px 22px;
  margin: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
#mic { background: #37ceff; color: #04101d; }
#stop { background: #24364d; color: white; }
.panel {
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #1b4567;
  border-radius: 15px;
  text-align: left;
  overflow-wrap: anywhere;
  min-height: 75px;
  background: #091528;
}
.label { color: #55d8ff; font-size: 12px; }
#status { color: #8caecb; margin: 15px; }
  
/* Hide JARVIS written reply */
.panel:has(#reply) {
  display: none;
}
  
</style>
</head>

<body>
<main class="app">
  <h1>JARVIS</h1>
  <p class="sub">PERSONAL AI VOICE ASSISTANT</p>

  <div class="orb" id="orb">🎙️</div>
  <p id="status">Ready for your command</p>

  <button id="mic">🎙️ START LISTENING</button>
  <button id="stop">🔇 STOP</button>

  <div class="panel">
    <div class="label">YOU SAID</div>
    <p id="heard">Waiting for voice...</p>
  </div>

  <div class="panel">
    <div class="label">JARVIS REPLY</div>
    <p id="reply">Hello! I am ready.</p>
  </div>
</main>


<script>
const API = "https://jarvis-web-api.onrender.com/chat";

const statusEl = document.getElementById("status");
const heardEl = document.getElementById("heard");
const replyEl = document.getElementById("reply");
const orb = document.getElementById("orb");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let keepListening = false;
let busy = false;

function cleanText(text) {
  return text
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/#{1,6}\s/g, "")
    .replace(/^\s*[-*]\s+/gm, "")
    .replace(/^\s*\d+\.\s+/gm, "")
    .replace(/\n{2,}/g, ". ")
    .trim();
}

function startRecognition() {
  if (!keepListening || busy || !recognition) return;

  try {
    recognition.start();
  } catch (e) {
    // Recognition may already be starting.
  }
}

function speak(text) {
  const message = cleanText(text);

  if (!("speechSynthesis" in window)) {
    statusEl.textContent = "Speech is not supported.";
    busy = false;
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = "hi-IN";
  utterance.rate = 1;
  utterance.volume = 1;

  utterance.onstart = () => {
    statusEl.textContent = "JARVIS is speaking...";
  };

  utterance.onend = () => {
    busy = false;

    if (keepListening) {
      statusEl.textContent = "Listening for your next command...";
      setTimeout(startRecognition, 500);
    } else {
      statusEl.textContent = "Ready";
    }
  };

  utterance.onerror = () => {
    busy = false;

    if (keepListening) {
      setTimeout(startRecognition, 500);
    }
  };

  speechSynthesis.speak(utterance);
}

async function askJarvis(message) {
  busy = true;
  statusEl.textContent = "JARVIS is thinking...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    const answer = cleanText(data.reply || "I received no reply.");

    replyEl.textContent = answer;
    speak(answer);
  } catch (error) {
    replyEl.textContent = "I couldn't connect. Please try again.";
    speak("Sorry, I couldn't connect. Please try again.");
  }
}

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    orb.classList.add("active");
    statusEl.textContent = "Listening... Speak now";
  };

  recognition.onresult = event => {
    const message = event.results[0][0].transcript.trim();

    if (!message) return;

    heardEl.textContent = message;
    askJarvis(message);
  };

  recognition.onerror = event => {
    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      keepListening = false;
      statusEl.textContent = "Please allow microphone access.";
    }
  };

  recognition.onend = () => {
    orb.classList.remove("active");

    if (keepListening && !busy) {
      setTimeout(startRecognition, 500);
    }
  };
} else {
  statusEl.textContent = "Please use a supported Chrome browser.";
}

document.getElementById("mic").onclick = () => {
  if (!recognition) {
    alert("Voice recognition is not supported.");
    return;
  }

  keepListening = true;
  startRecognition();
};

document.getElementById("stop").onclick = () => {
  keepListening = false;
  busy = false;

  if (recognition) recognition.stop();
  if ("speechSynthesis" in window) speechSynthesis.cancel();

  orb.classList.remove("active");
  statusEl.textContent = "Stopped";
};
</script>
  
</body>
</html>
